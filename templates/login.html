<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - University Application Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        (function () {
            const saved = localStorage.getItem("theme");
            if (saved) document.documentElement.setAttribute("data-theme", saved);
        })();
    </script>
</head>
<body>
    <div class="login-page">
        <h1 class="auth-brand">
            <img src="{{ url_for('static', filename='logo.svg') }}" alt="" class="brand-logo">
            University Application Tracker
        </h1>

        <form action="/login" method="POST" class="add-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="email" name="email" placeholder="Email" required autofocus style="width: 100%; margin-bottom: 10px;">
            <input type="password" name="password" placeholder="Password" required style="width: 100%; margin-bottom: 10px;">
            <button type="submit" class="btn-primary" style="width: 100%;">Log In</button>
        </form>

        {% if error %}
        <p class="login-error">{{ error }}</p>
        {% endif %}

        <p class="auth-switch">Don't have an account? <a href="/signup">Sign up</a></p>
        <a href="/demo-login" class="btn-secondary" style="display: block; text-align: center; margin-top: 14px;">Try the demo &rarr;</a>
    </div>
</body>
</html>
