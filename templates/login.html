<!DOCTYPE html>
<html>
<head>
    <title>Login - University Application Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-page">
        <h1>University Application Tracker</h1>

        <form action="/login" method="POST" class="add-form">
            <input type="password" name="password" placeholder="Password" required autofocus style="width: 100%; margin-bottom: 10px;">
            <button type="submit" class="btn-primary" style="width: 100%;">Log In</button>
        </form>

        {% if error %}
        <p class="login-error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
